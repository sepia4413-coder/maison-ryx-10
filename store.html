<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison Ryx</title><link rel="icon" href="logo.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#faf6ef;--card:#fff;--ink:#1c1712;--mute:#7a6f60;--gold:#a8842f;--line:#e6dccb;--dark:#1c1712;--onDark:#f3e9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f0b;--card:#1c1712;--ink:#f3e9d2;--mute:#a49782;--gold:#d4af5f;--line:#33291d;--dark:#000;--onDark:#f3e9d2}}
:root[data-theme="dark"]{--bg:#120f0b;--card:#1c1712;--ink:#f3e9d2;--mute:#a49782;--gold:#d4af5f;--line:#33291d;--dark:#000;--onDark:#f3e9d2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:300}
.bar{background:var(--dark);color:var(--onDark);text-align:center;font-size:13px;padding:8px 12px;letter-spacing:.5px}
header{text-align:center;padding:38px 16px 10px}
.logo{font-family:Amiri,serif;font-size:clamp(40px,8vw,68px);letter-spacing:6px;color:var(--gold);margin:0;font-weight:400}
.logo span{display:block;font-size:12px;letter-spacing:8px;color:var(--mute);font-family:Cairo,sans-serif;margin-top:-4px}
.hero{max-width:760px;margin:18px auto 0;font-family:Amiri,serif;font-size:clamp(18px,3vw,24px);line-height:1.9}
.hero i{display:block;width:60px;height:1px;background:var(--gold);margin:18px auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:1100px;margin:22px auto 8px;padding:0 16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:100%}
.tools input{max-width:240px;border-radius:99px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;max-width:1200px;margin:16px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.img{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(160deg,var(--line),transparent);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:#fff;font-size:11px;padding:3px 10px;border-radius:99px}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.kind{font-size:11px;color:var(--gold);letter-spacing:1px}
.name{font-family:Amiri,serif;font-size:21px;font-weight:700;margin:0}
.notes,.desc{font-size:13px;color:var(--mute);margin:0;line-height:1.7}
.price{margin-top:auto;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price s{color:var(--mute);font-weight:300;font-size:13px}.price b{color:var(--gold);font-size:12px}
.out{opacity:.55}
.adm{display:flex;gap:6px;margin-top:8px}
.btn{background:var(--ink);color:var(--bg);border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
#admin{text-align:center;padding:12px}
dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;width:min(520px,94vw);padding:20px}
dialog::backdrop{background:#000a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}.f .w{grid-column:1/-1}
footer{background:var(--dark);color:var(--onDark);text-align:center;padding:36px 16px;font-size:13px}
footer .logo{font-size:30px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;display:none;z-index:9}

#admin{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.manager{max-width:1100px;margin:0 auto 10px;padding:0 16px}
.managerBox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.ob{width:100%;margin-top:6px}
.managerBox span{font-size:13px;color:var(--mute)}

.ob{width:100%;margin-top:8px}.bottle{font-family:Amiri;font-size:36px;color:var(--gold);border:1px solid var(--gold);padding:25px 10px}.show{display:block!important}
dialog{max-width:520px}.modal-grid{display:grid;gap:10px}.modal-grid label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
</style></head><body>
<div class="bar">توصيل سريع · عينات مجانية مع كل طلب · عطور بتوقيع خاص</div>
<header><img class="brand-logo" src="logo.svg" alt="Maison Ryx" style="width:min(520px,88vw);height:auto;margin:auto;display:block"><h1 class="logo" style="position:absolute;left:-9999px">MAISON RYX<span>PARFUMS · عطور</span></h1><p class="hero">عطور تُصنع بشغف، وتُختار بعناية.<i></i>من تصميمنا الخاص ومن مختاراتنا</p></header>
<div class="tools"><div id="chips"></div><input id="q" type="search" placeholder="ابحث عن عطر…"></div><main id="grid"></main>
<footer><img src="logo.svg" alt="Maison Ryx" style="width:min(360px,78vw);filter:brightness(1.05);margin-bottom:10px"><p>© 2026 Maison Ryx · جميع الحقوق محفوظة</p><a href="admin.html" style="color:#f3e9d2;text-decoration:none;opacity:.65;font-size:12px">دخول الإدارة</a></footer>
<dialog id="orderForm"><h3 id="productTitle" class="name"></h3><div class="modal-grid">
<label>اسمك<input id="on"></label><label>رقم الهاتف<input id="op" type="tel"></label><label>الكمية<input id="oq" type="number" min="1" value="1"></label><label>المدينة / العنوان<input id="oa"></label>
</div><div class="adm"><button class="btn" id="sendOrder">إرسال الطلب</button><button class="btn g" id="cancelOrder">إلغاء</button></div></dialog>
<div id="toast"></div><script src="config.js"></script><script>const cfg = window.MAISON_RYX_CONFIG;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
let products=[], cat='all', q='';

const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cats={all:'الكل',perfume:'عطور',oil:'زيوت',incense:'بخور',mist:'بخاخات'};

function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}

async function loadProducts(){
  const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
  if(error){console.error(error); toast('تعذر تحميل العطور'); return;}
  products=data||[]; render();
}
function render(){
  document.querySelector('#chips').innerHTML=Object.entries(cats).map(([k,v])=>
    `<button class="chip ${k===cat?'on':''}" data-cat="${k}">${v}</button>`).join('');
  const list=products.filter(i=>(cat==='all'||i.category===cat)&&
    (!q||(i.name+' '+(i.notes||'')+' '+(i.description||'')).toLowerCase().includes(q.toLowerCase())));
  document.querySelector('#grid').innerHTML=list.map(i=>{
    const discount=i.old_price && i.old_price>i.price ? Math.round((1-i.price/i.old_price)*100):0;
    return `<article class="card ${i.out_of_stock?'out':''}">
      <div class="img">${i.image_url?`<img src="${esc(i.image_url)}" alt="${esc(i.name)}">`:`<div class="bottle">RYX</div>`}</div>
      ${i.out_of_stock?'<span class="tag">نفد</span>':i.badge?`<span class="tag">${esc(i.badge)}</span>`:''}
      <div class="body">
        <span class="kind">${i.source==='own'?'من تصميم Ryx':'مختارات Ryx'}${i.size_ml?' · '+i.size_ml+' مل':''}</span>
        <h3 class="name">${esc(i.name)}</h3>
        ${i.notes?`<p class="notes">${esc(i.notes)}</p>`:''}
        ${i.description?`<p class="desc">${esc(i.description)}</p>`:''}
        <div class="price">${i.price} ${cfg.CURRENCY}${discount?` <s>${i.old_price} ${cfg.CURRENCY}</s><b>-${discount}%</b>`:''}</div>
        ${!i.out_of_stock?`<button class="btn ob" data-order="${i.id}">اطلب الآن</button>`:''}
      </div>
    </article>`;
  }).join('') || '<p style="grid-column:1/-1;text-align:center;color:var(--mute)">لا توجد عطور متاحة حاليًا.</p>';
}
function openOrder(p){
  document.querySelector('#productTitle').textContent=`${p.name} — ${p.price} ${cfg.CURRENCY}`;
  document.querySelector('#orderForm').dataset.id=p.id;
  document.querySelector('#orderForm').showModal();
}
async function submitOrder(){
  const form=document.querySelector('#orderForm');
  const p=products.find(x=>x.id===form.dataset.id);
  if(!p) return;
  const name=document.querySelector('#on').value.trim(), phone=document.querySelector('#op').value.trim(), address=document.querySelector('#oa').value.trim();
  const quantity=Math.max(1,Number(document.querySelector('#oq').value)||1);
  if(!name||!phone||!address) return toast('أكمل الاسم والهاتف والعنوان');
  const {error}=await sb.from('orders').insert({
    product_id:p.id, product_name:p.name, unit_price:p.price, quantity,
    customer_name:name, phone, address
  });
  if(error){console.error(error); return toast('تعذر إرسال الطلب');}
  if(cfg.WHATSAPP && !cfg.WHATSAPP.includes('X')){
    const m=`طلب جديد من Maison Ryx\nالعطر: ${p.name}\nالكمية: ${quantity}\nالسعر: ${p.price} ${cfg.CURRENCY}\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}`;
    window.open(`https://wa.me/${cfg.WHATSAPP}?text=${encodeURIComponent(m)}`,'_blank');
  }
  form.close(); document.querySelector('#orderForm').reset(); toast('تم إرسال طلبك بنجاح');
}
document.addEventListener('click',e=>{
  if(e.target.dataset.cat){cat=e.target.dataset.cat;render();}
  if(e.target.dataset.order)openOrder(products.find(x=>x.id===e.target.dataset.order));
  if(e.target.id==='cancelOrder')document.querySelector('#orderForm').close();
  if(e.target.id==='sendOrder')submitOrder();
});
document.querySelector('#q').addEventListener('input',e=>{q=e.target.value.trim();render()});
loadProducts();
</script></body></html>
